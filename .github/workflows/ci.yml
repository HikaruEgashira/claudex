name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: shellcheck
        timeout-minutes: 5
        run: shellcheck claudex install.sh
      - name: proxy self-test (routing + SSE + auth swap)
        timeout-minutes: 5
        run: node claudexd.mjs --self-test